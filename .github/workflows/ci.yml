name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python and JSON
        run: |
          python -m py_compile daemon.py bin/omarchy-camguardctl
          python -m json.tool manifest.json >/dev/null
          python -m json.tool config.example.json >/dev/null

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate shell scripts
        run: |
          bash -n install.sh install-system.sh uninstall.sh uninstall-system.sh
          shellcheck install.sh install-system.sh uninstall.sh uninstall-system.sh
